<style>
  :root { --fg: #f3f1fa; --muted: #9a97ad; --line: rgba(255,255,255,.12); --card: rgba(16,13,30,.84); --g1: #ff4d8d; --g2: #ffb020; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #0b0a16; color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  [hidden] { display: none !important; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; touch-action: none; }
  .top { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 5; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .brand { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 9px 13px; font: 700 .95rem "Space Grotesk"; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .nav { display: flex; gap: 6px; }
  .nav a { font-size: .78rem; color: var(--fg); text-decoration: none; padding: 9px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); white-space: nowrap; }

  .panel { position: fixed; left: 12px; top: 70px; width: 300px; max-height: calc(100% - 86px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 5; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .panel h4 { font: 600 .64rem "JetBrains Mono"; letter-spacing: .12em; color: #ffb3cf; text-transform: uppercase; margin: 12px 0 7px; }
  .panel h4:first-of-type { margin-top: 0; }
  .occ { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .occ button { border: 1.5px solid var(--line); background: rgba(255,255,255,.04); color: #d9d6e8; border-radius: 12px; padding: 9px 4px; font: 600 .72rem Inter; cursor: pointer; line-height: 1.2; }
  .occ button i { display: block; font-style: normal; font-size: 1.3rem; margin-bottom: 2px; }
  .occ button.on { border-color: #ff4d8d; background: rgba(255,77,141,.14); color: #fff; }
  .in { width: 100%; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 12px; color: #fff; padding: 10px 12px; font: 500 .9rem Inter; outline: 0; }
  .in:focus { border-color: #ff4d8d; }
  textarea.in { min-height: 76px; resize: vertical; line-height: 1.45; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chips button { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 5px 10px; font: 500 .74rem Inter; cursor: pointer; }
  .chips button:hover { color: #fff; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  .btn { border: 1px solid var(--line); background: rgba(255,255,255,.06); color: #fff; border-radius: 12px; padding: 11px 8px; font: 700 .82rem Inter; cursor: pointer; text-decoration: none; text-align: center; }
  .btn.wa { background: #25d366; color: #062e16; border: 0; grid-column: 1 / -1; font-size: .92rem; }
  .btn.pri { background: linear-gradient(100deg, var(--g1), var(--g2)); border: 0; }
  .note { font-size: .72rem; color: var(--muted); line-height: 1.45; margin-top: 10px; }

  .card { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: min(420px, calc(100% - 340px)); z-index: 6; background: rgba(16,13,30,.86); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); text-align: center; box-shadow: 0 20px 60px -20px rgba(0,0,0,.8); }
  .card .t { font: 800 clamp(1.4rem, 4.6vw, 2rem)/1.12 "Space Grotesk"; background: linear-gradient(100deg, var(--g1), var(--g2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card .m { font-size: .92rem; color: #e8e6f2; line-height: 1.5; margin-top: 8px; white-space: pre-wrap; }
  .card .f { font: 600 .84rem Inter; color: #cfcbe0; margin-top: 8px; }

  body.recipient .panel { display: none; }
  body.recipient .card { left: 50%; right: auto; transform: translateX(-50%); width: min(480px, calc(100% - 24px)); }

    .panel.closed { transform: translateY(calc(100% - 46px)); }
    .toggleP { display: block; width: 100%; border: 0; background: none; color: #fff; font: 700 .86rem Inter; padding: 2px 0 10px; cursor: pointer; }
    .card { left: 8px; right: 8px; width: auto; top: 64px; bottom: auto; padding: 12px 14px; }
    body.recipient .card { top: auto; bottom: max(12px, env(safe-area-inset-bottom)); }
    .card .m { font-size: .86rem; }
  }

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = s => document.querySelector(s);
const FAMILY = "Narendra, Raghuvanshmani & Manideep Mittal";
const clip = (s, n) => String(s || "").replace(/[\u0000-\u001f<>]/g, " ").replace(/\s+/g, " ").trim().slice(0, n);
const clipMsg = (s, n) => String(s || "").replace(/[<>]/g, "").replace(/\r/g, "").slice(0, n).trim();

/* ---------- occasions ---------- */
const OCC = {
  birthday: { e: "🎂", n: "Birthday", g: ["#ff4d8d", "#ffb020"], bg: [0x2a0f3d, 0x0b0a16], extra: "Age (optional)", extraPh: "e.g. 25", num: true,
    title: (to, x) => `Happy ${x ? ordinal(x) + " " : ""}Birthday${to ? ", " + to : ""}!`, msg: "Wishing you a year full of laughter, good health and big wins. Have the best day! 🎉",
    act: "🕯️ Make a wish & blow out the candles" },
  anniversary: { e: "💍", n: "Anniversary", g: ["#ff5c8a", "#ffd1dc"], bg: [0x3a0d1f, 0x0d0610], extra: "Years together (optional)", extraPh: "e.g. 25", num: true,
    title: (to, x) => `Happy ${x ? ordinal(x) + " " : ""}Anniversary${to ? ", " + to : ""}!`, msg: "Wishing you both endless love, laughter and many more beautiful years together. ❤️",
    act: "💞 Tap to celebrate" },
  congrats: { e: "🏆", n: "Congrats", g: ["#ffd23f", "#ff8c1a"], bg: [0x2b1d05, 0x0b0906], extra: "What for? (optional)", extraPh: "e.g. on your new job",
    title: (to, x) => `Congratulations${x ? " " + x : ""}${to ? ", " + to : ""}!`, msg: "So proud of you! All your hard work has paid off. Here's to many more successes! 🥂",
    act: "🎊 Tap to celebrate" },
  goodluck: { e: "🍀", n: "Good luck", g: ["#3bd16f", "#b2f7a1"], bg: [0x062a1a, 0x050b09], extra: "For what? (optional)", extraPh: "e.g. for your exams",
    title: (to, x) => `Good luck${x ? " " + x : ""}${to ? ", " + to : ""}!`, msg: "You've got this! Believe in yourself and go shine. All the best! ✨",
    act: "🌟 Tap for some luck" },
  thanks: { e: "🙏", n: "Thank you", g: ["#ff6b6b", "#ffd166"], bg: [0x2d0d14, 0x0b0607], extra: "", num: false,
    title: to => `Thank you${to ? ", " + to : ""}!`, msg: "Thank you for everything you do. It means more than you know. 💛",
    act: "💖 Tap to send love" },
  getwell: { e: "💐", n: "Get well", g: ["#ffb3c7", "#ffe08a"], bg: [0x2a1d2e, 0x0b0910], extra: "", num: false,
    title: to => `Get well soon${to ? ", " + to : ""}!`, msg: "Sending healing wishes and lots of rest your way. Feel better very soon! 🌼",
    act: "🌸 Tap for get-well petals" },
};
function ordinal(x) { const n = parseInt(x, 10); if (!(n > 0 && n < 200)) return ""; const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

/* ---------- state (creator) + URL (recipient) ---------- */
const P = new URLSearchParams(location.search);
const saved = (() => { try { return JSON.parse(localStorage.getItem("wish_v1") || "{}"); } catch { return {}; } })();
const W = { o: "birthday", to: "", from: saved.from || "Manideep", extra: "", msg: "" };
const RECIPIENT = !!OCC[P.get("o")];
if (RECIPIENT) Object.assign(W, { o: P.get("o"), to: clip(P.get("to"), 28), from: clip(P.get("from"), 48), extra: clip(P.get("x"), 40), msg: clipMsg(P.get("m"), 240) });
else if (OCC[saved.o]) W.o = saved.o;
const save = () => { if (!RECIPIENT) try { localStorage.setItem("wish_v1", JSON.stringify({ from: W.from, o: W.o })); } catch {} };
const occ = () => OCC[W.o];
const extraVal = () => occ().num ? (parseInt(W.extra, 10) > 0 ? String(parseInt(W.extra, 10)) : "") : W.extra;
const title = () => occ().title(W.to, extraVal());
const message = () => W.msg || occ().msg;

/* ---------- three.js setup ---------- */
const host = $("#scene");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, enablePan: false, minDistance: 7, maxDistance: 30, maxPolarAngle: Math.PI * .49, autoRotate: true, autoRotateSpeed: .7 });
renderer.domElement.addEventListener("pointerdown", () => controls.autoRotate = false);
scene.add(new THREE.HemisphereLight(0xfff0ff, 0x302040, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(6, 14, 8); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); Object.assign(key.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10 }); scene.add(key);
const rim = new THREE.PointLight(0xff9ad5, 30, 40, 1.5); rim.position.set(-8, 6, -6); scene.add(rim);

const M = {}; const mat = (c, o = {}) => M[c + JSON.stringify(o)] ||= new THREE.MeshStandardMaterial({ color: c, roughness: o.r ?? .5, metalness: o.m ?? 0, emissive: o.e ?? 0, emissiveIntensity: o.ei ?? 1, side: o.ds ? THREE.DoubleSide : THREE.FrontSide, transparent: o.op != null, opacity: o.op ?? 1 });
const basic = c => new THREE.MeshBasicMaterial({ color: c });
function mesh(geo, m, parent, x = 0, y = 0, z = 0) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; parent.add(o); return o; }
const cylB = (rt, rb, h, m, p, x, y, z, seg = 40) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m, p, x, y + h / 2, z);
function heartGeo(size = 1, depth = .35) {
  const s = new THREE.Shape(); s.moveTo(.25, .25); s.bezierCurveTo(.25, .25, .2, 0, 0, 0); s.bezierCurveTo(-.3, 0, -.3, .35, -.3, .35); s.bezierCurveTo(-.3, .55, -.1, .77, .25, .95); s.bezierCurveTo(.6, .77, .8, .55, .8, .35); s.bezierCurveTo(.8, .35, .8, 0, .5, 0); s.bezierCurveTo(.35, 0, .25, .25, .25, .25);
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: .08, bevelSize: .08, bevelSegments: 4, curveSegments: 20 }); g.center(); g.rotateZ(Math.PI); g.scale(size, size, size); return g;
}
function softTex() { const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d"), r = x.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.5, "rgba(255,255,255,.35)"); r.addColorStop(1, "rgba(255,255,255,0)"); x.fillStyle = r; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); }
const SOFT = softTex();
function textSprite(lines, g, w = 9) {
  const c = document.createElement("canvas"); c.width = 1024; c.height = 140 * lines.length + 40; const x = c.getContext("2d");
  lines.forEach((l, i) => {
    const big = i === 0, gr = x.createLinearGradient(80, 0, 944, 0); gr.addColorStop(0, g[0]); gr.addColorStop(1, g[1]);
    let fs = big ? 120 : 92; do { x.font = `800 ${fs}px Inter, "Space Grotesk", sans-serif`; fs -= 4; } while (x.measureText(l).width > 960);
    x.textAlign = "center"; x.textBaseline = "middle"; x.shadowColor = "rgba(0,0,0,.6)"; x.shadowBlur = 18; x.fillStyle = big ? gr : "#ffffff"; x.fillText(l, 512, 90 + i * 140);
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false })); sp.scale.set(w, w * c.height / 1024, 1); return sp;
}

/* ---------- shared effects ---------- */
// confetti / petals: one instanced pool
const CN = 600, conf = new THREE.InstancedMesh(new THREE.PlaneGeometry(.16, .3), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), CN);
conf.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(conf);
const cp = Array.from({ length: CN }, () => ({ live: 0, p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), w: new THREE.Vector3(), g: 3 }));
const dummy = new THREE.Object3D(); let cIdx = 0;
cp.forEach((_, i) => { dummy.scale.setScalar(0); dummy.updateMatrix(); conf.setMatrixAt(i, dummy.matrix); conf.setColorAt(i, new THREE.Color(1, 1, 1)); });
function confetti(n, at, { spread = 4, up = 8, cols = [0xff4d8d, 0xffd23f, 0x00e0b8, 0x7c5cff, 0xff8c1a, 0xffffff], g = 6, life = 4, shape = 1 } = {}) {
  for (let k = 0; k < n; k++) {
    const i = cIdx = (cIdx + 1) % CN, q = cp[i];
    q.live = life * (.7 + Math.random() * .5); q.g = g; q.s = shape;
    q.p.set(at.x + (Math.random() - .5) * .6, at.y, at.z + (Math.random() - .5) * .6);
    q.v.set((Math.random() - .5) * spread * 2, up * (.6 + Math.random() * .6), (Math.random() - .5) * spread * 2);
    q.r.set(Math.random() * 6, Math.random() * 6, Math.random() * 6); q.w.set((Math.random() - .5) * 12, (Math.random() - .5) * 12, (Math.random() - .5) * 12);
    conf.setColorAt(i, new THREE.Color(cols[k % cols.length]));
  }
  conf.instanceColor.needsUpdate = true;
}
function rain(n, cols, g = .9, s = 1.4) { for (let k = 0; k < n; k++) { confetti(1, new THREE.Vector3((Math.random() - .5) * 18, 12 + Math.random() * 6, (Math.random() - .5) * 18), { spread: .4, up: 0, cols, g, life: 9, shape: s }); } }
function stepConfetti(dt, t) {
  for (let i = 0; i < CN; i++) {

  $("#extraBox").hidden = !o.extra; $("#extraLbl").textContent = o.extra; $("#extra").placeholder = o.extraPh || ""; $("#extra").inputMode = o.num ? "numeric" : "text";
  $("#to").value = W.to; $("#from").value = W.from; $("#extra").value = W.extra; $("#msg").value = message();
}
$("#occ").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b) return; const wasDefault = !W.msg || Object.values(OCC).some(x => x.msg === W.msg); W.o = b.dataset.k; W.extra = ""; if (wasDefault) W.msg = ""; syncPanel(); setScene(true); save(); });
$("#to").addEventListener("input", e => { W.to = clip(e.target.value, 28); setScene(false); });
$("#extra").addEventListener("input", e => { W.extra = occ().num ? e.target.value.replace(/\D/g, "").slice(0, 3) : clip(e.target.value, 40); if (occ().num) e.target.value = W.extra; clearTimeout(window._xt); window._xt = setTimeout(() => setScene(true), 350); });
$("#from").addEventListener("input", e => { W.from = clip(e.target.value, 48); drawCard(); save(); });
$("#fromChips").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { W.from = b.dataset.v; $("#from").value = W.from; drawCard(); save(); } });
$("#msg").addEventListener("input", e => { W.msg = clipMsg(e.target.value, 240); if (W.msg === occ().msg) W.msg = ""; drawCard(); });
$("#resetMsg").addEventListener("click", () => { W.msg = ""; $("#msg").value = occ().msg; drawCard(); });
$("#toggleP").addEventListener("click", () => $("#panel").classList.toggle("closed"));

function link() {
  const base = /^https?:/.test(location.protocol) ? location.origin + location.pathname : "https://manideepcs024.github.io/wish/";
  const q = new URLSearchParams({ o: W.o }); if (W.to) q.set("to", W.to); if (W.from) q.set("from", W.from); if (extraVal()) q.set("x", extraVal()); if (W.msg) q.set("m", W.msg);
  return base + "?" + q.toString();
}
function waText() { const o = occ(); return `${o.e} *${title()}*\n\n🎁 Here's a little 3D surprise for you${W.from ? ` from ${W.from}` : ""}. Tap to open 👇\n${link()}`; }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2000); }
$("#sendWa").addEventListener("click", () => window.open("https://wa.me/?text=" + encodeURIComponent(waText()), "_blank", "noopener"));
$("#copyLink").addEventListener("click", async () => { try { await navigator.clipboard.writeText(waText()); toast("🔗 Copied. Paste it in any chat"); } catch { prompt("Copy this:", waText()); } });
$("#preview").addEventListener("click", () => window.open(link(), "_blank", "noopener"));
$("#saveImg").addEventListener("click", async e => { const b = e.target, t0 = b.textContent; b.textContent = "Creating…"; try { await shareImage(); } finally { b.textContent = t0; } });

/* ---------- card image ---------- */
function wrap(x, text, maxW) { const out = []; String(text).split("\n").forEach(par => { let line = ""; par.split(/\s+/).filter(Boolean).forEach(w => { const t = line ? line + " " + w : w; if (x.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }); if (line) out.push(line); }); return out; }
async function cardCanvas() {
  await Promise.all(["800 90px Inter", "500 34px Inter", "600 30px Inter"].map(f => document.fonts.load(f).catch(() => {})));
  const o = occ(), CW = 1080, IH = 1080, prev = { pr: renderer.getPixelRatio(), aspect: camera.aspect }, bannerVis = banner.visible;
  banner.visible = false; renderer.setPixelRatio(1); renderer.setSize(CW, IH, false); camera.aspect = 1; camera.updateProjectionMatrix(); renderer.render(scene, camera);
  const c = document.createElement("canvas"), x = c.getContext("2d"); c.width = CW;
  x.font = "500 34px Inter"; const ml = wrap(x, message(), CW - 160).slice(0, 5);
  const H = IH + 150 + ml.length * 48 + 140; c.height = H;
  const bg = x.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#" + new THREE.Color(o.bg[0]).getHexString()); bg.addColorStop(1, "#0b0a16"); x.fillStyle = bg; x.fillRect(0, 0, CW, H);
  x.drawImage(renderer.domElement, 0, 0, CW, IH);
  banner.visible = bannerVis; renderer.setPixelRatio(prev.pr); renderer.setSize(innerWidth, innerHeight); camera.aspect = prev.aspect; camera.updateProjectionMatrix();
  const fade = x.createLinearGradient(0, IH - 260, 0, IH); fade.addColorStop(0, "rgba(11,10,22,0)"); fade.addColorStop(1, "rgba(11,10,22,1)"); x.fillStyle = fade; x.fillRect(0, IH - 260, CW, 260);
  const gr = x.createLinearGradient(140, 0, CW - 140, 0); gr.addColorStop(0, o.g[0]); gr.addColorStop(1, o.g[1]);
  const t = `${title()} ${o.e}`; let fs = 92; do { x.font = `800 ${fs}px Inter`; fs -= 4; } while (x.measureText(t).width > CW - 100 && fs > 40);
  x.textAlign = "center"; x.fillStyle = gr; x.fillText(t, CW / 2, IH + 40);
  x.fillStyle = "#ece9f6"; x.font = "500 34px Inter"; ml.forEach((l, i) => x.fillText(l, CW / 2, IH + 120 + i * 48));
  x.fillStyle = "#cfcbe0"; x.font = "600 30px Inter"; if (W.from) x.fillText(`— ${W.from}`, CW / 2, IH + 120 + ml.length * 48 + 30);
  x.fillStyle = "#6f6c85"; x.font = "500 22px 'JetBrains Mono', monospace"; x.fillText("Make your own 3D wish · manideepcs024.github.io/wish", CW / 2, H - 34);
  return c;
}
async function shareImage() {
  const c = await cardCanvas(), blob = await new Promise(r => c.toBlob(r, "image/jpeg", .92)), name = `${W.o}-wish${W.to ? "-" + W.to.toLowerCase().replace(/[^a-z0-9]+/g, "-") : ""}.jpg`, file = new File([blob], name, { type: "image/jpeg" });
  if (matchMedia("(hover: none)").matches && navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === "AbortError") return; } }
  const url = URL.createObjectURL(blob), m = document.createElement("div"); m.className = "gmodal";
  m.innerHTML = `<div class="inner"><img src="${url}" alt="Wish card" /><p>Download the card and share it, or long-press to save it.</p><a href="${url}" download="${name}">⬇ Download</a><button>Done</button></div>`;
  m.addEventListener("click", e => { if (e.target === m || e.target.tagName === "BUTTON") m.remove(); }); document.body.appendChild(m);
}

/* ---------- animation ---------- */
let last = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - (last || now)) / 1000), t = now / 1000; last = now;
  flames.forEach(f => { const u = f.userData, s = u.lit ? 1 + Math.sin(t * 12 + u.ph) * .12 + Math.random() * .06 : Math.max(0, f.scale.x - dt * 4); f.scale.set(u.lit ? 1 : s, s, u.lit ? 1 : s); u.glow.material.opacity = u.lit ? .8 + Math.sin(t * 9 + u.ph) * .2 : Math.max(0, u.glow.material.opacity - dt * 3); });
  bobs.forEach(b => { b.position.y = b.userData.y + Math.sin(t * 1.2 + b.userData.ph) * .35; if (b.userData.spin) b.rotation.y += dt * .8; });
  spins.forEach(s => { if (s.userData.sway) s.rotation.y = Math.sin(t * .8) * .5; else s.rotation.y += dt * .6; if (s.userData.pulse) { const k = s.userData.boom ? Math.max(0, 1 - (now - s.userData.boom) / 900) : 0; s.scale.setScalar(1 + Math.sin(t * 3) * .04 + k * .25); } });
  sparkles.material.opacity = .5 + Math.sin(t * 2) * .2; sparkles.rotation.y += dt * .03;
  if (done && cur?.userData.petals && Math.random() < .25) rain(1, cur.userData.petals);
  stepConfetti(dt, t);
  controls.update(); renderer.render(scene, camera);
});
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ---------- start ---------- */
camera.position.set(0, 7, 16.5);
setScene(true);
if (RECIPIENT) {
  document.body.classList.add("recipient");
  const o = occ(); $("#iTitle").textContent = W.to ? `${W.to}, you have a surprise! ${o.e}` : `You have a surprise! ${o.e}`;
  $("#iSub").textContent = W.from ? `From ${W.from}` : "Tap to open it";
  $("#intro").hidden = false; $("#card").hidden = true; camera.position.set(0, 18, 34);
  $("#openBtn").addEventListener("click", () => {
    $("#intro").style.opacity = 0; setTimeout(() => $("#intro").hidden = true, 700); $("#card").hidden = false;
    const p0 = camera.position.clone(), p1 = new THREE.Vector3(0, 5.5, 16.5), st = performance.now();
    const fly = () => { const k = Math.min(1, (performance.now() - st) / 1600), e = 1 - Math.pow(1 - k, 3); camera.position.lerpVectors(p0, p1, e); if (k < 1) requestAnimationFrame(fly); }; fly();
    confetti(200, new THREE.Vector3(0, 2, 2), { spread: 6, up: 11 });
  });
} else { syncPanel(); if (innerWidth <= 760) $("#panel").classList.add("closed"); }
window.__wish = { W, setScene, celebrate, cardCanvas, link, waText, scene };
